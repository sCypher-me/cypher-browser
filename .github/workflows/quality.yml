name: Verificar qualidade do Cypher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências travadas
        run: npm ci
      - name: Bloquear vulnerabilidades altas ou críticas
        run: npm audit --audit-level=high
      - name: Verificar sintaxe e tipos
        run: npm run check
      - name: Executar testes unitários
        run: npm test
      - name: Compilar o Cypher
        run: npm run build
      - name: Executar smoke tests do navegador
        run: npm run test:smoke

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências travadas
        run: npm ci
      - name: Verificar sintaxe e testes
        run: |
          npm run check
          npm test
      - name: Compilar e empacotar para Linux (sem publicar)
        run: |
          npm run build
          npx electron-builder --linux dir --publish never
