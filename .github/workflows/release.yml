name: Publicar atualização do Cypher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag de versão já existente para publicar
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Electron com Widevine (castLabs), quando há credenciais EVS
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          CASTLABS_ELECTRON: v44.5.1+wvcus
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EVS_ACCOUNT_NAME) -or [string]::IsNullOrWhiteSpace($env:EVS_PASSWD)) {
            Write-Host "Sem credenciais EVS: compilação sem Widevine."
            exit 0
          }
          npm install --no-save --ignore-scripts=false "electron@https://github.com/castlabs/electron-releases#$env:CASTLABS_ELECTRON"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar o Electron da castLabs." }
          python -m pip install --upgrade castlabs-evs
          python -m castlabs_evs.account reauth -A $env:EVS_ACCOUNT_NAME -P $env:EVS_PASSWD
          if ($LASTEXITCODE -ne 0) { throw "Falha ao autenticar na conta EVS da castLabs." }
          "CYPHER_WIDEVINE=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verificar sintaxe e tipos
        run: npm run check
      - name: Executar testes unitários
        run: npm test
      - name: Bloquear publicação com vulnerabilidades altas conhecidas
        run: npm audit --audit-level=high
      - name: Baixar e verificar Tor e i2pd nativos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run prepare:privacy-runtime
      - name: Validar versão e configurar canal público
        env:
          CYPHER_UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.CYPHER_UPDATE_SIGNING_PUBLIC_KEY }}
          CYPHER_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.CYPHER_UPDATE_SIGNING_PRIVATE_KEY }}
          CYPHER_SAFE_BROWSING_KEY: ${{ secrets.SAFE_BROWSING_API_KEY }}
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:RELEASE_TAG -ne $expectedTag) { throw "A tag precisa ser $expectedTag para corresponder ao package.json." }
          $hasPublicKey = -not [string]::IsNullOrWhiteSpace($env:CYPHER_UPDATE_SIGNING_PUBLIC_KEY)
          $hasPrivateKey = -not [string]::IsNullOrWhiteSpace($env:CYPHER_UPDATE_SIGNING_PRIVATE_KEY)
          if ($hasPublicKey -ne $hasPrivateKey) { throw "Configure juntos CYPHER_UPDATE_SIGNING_PUBLIC_KEY (Actions variable) e CYPHER_UPDATE_SIGNING_PRIVATE_KEY (Actions secret)." }
          if (-not $hasPublicKey) { throw "A publicação exige assinatura Ed25519. Configure CYPHER_UPDATE_SIGNING_PUBLIC_KEY (Actions variable) e CYPHER_UPDATE_SIGNING_PRIVATE_KEY (Actions secret)." }
          @{ repository = $env:GITHUB_REPOSITORY; updateSigningPublicKey = $env:CYPHER_UPDATE_SIGNING_PUBLIC_KEY; safeBrowsingApiKey = "$env:CYPHER_SAFE_BROWSING_KEY" } | ConvertTo-Json -Compress | Set-Content electron/update-config.json -Encoding utf8
      - name: Compilar a interface do Cypher
        run: npm run build
      - name: Conferir listas de bloqueio compiladas
        run: node scripts/verify-tracker-lists.cjs
      - name: Executar smoke tests do navegador
        run: npm run test:smoke
      - name: Gerar aplicativo Windows e versão portátil
        shell: pwsh
        run: |
          if ($env:CYPHER_WIDEVINE -eq '1') {
            # Usa o Electron da castLabs já instalado; o gancho afterPack assina o VMP.
            $electronVersion = (Get-Content node_modules/electron/package.json -Raw | ConvertFrom-Json).version -replace '\+.*$', ''
            npx electron-builder --win dir portable --publish never "-c.electronDist=node_modules/electron/dist" "-c.electronVersion=$electronVersion"
          } else {
            npx electron-builder --win dir portable --publish never
          }
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar o aplicativo." }
      - name: Compilar o instalador autoral Cypher
        run: node scripts/build-installer.cjs
      - name: Gerar manifestos de atualização (canal, versão mínima e notas)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tags = (gh release list --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName') -join ','
          node scripts/build-update-manifest.cjs $version release artifacts $tags
      - name: Assinar manifestos de atualização
        env:
          CYPHER_UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.CYPHER_UPDATE_SIGNING_PUBLIC_KEY }}
          CYPHER_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.CYPHER_UPDATE_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          foreach ($manifest in Get-ChildItem artifacts -Filter '*.json' | Where-Object { $_.Name -in @('latest.json', 'stable.json', 'preview.json') }) {
            node scripts/sign-update-manifest.cjs $manifest.FullName
            if ($LASTEXITCODE -ne 0) { throw "Falha ao assinar $($manifest.Name)" }
          }
      - name: Publicar a versão e atualizar o canal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assets = @("release/Cypher-$version-Setup.exe", "release/Cypher-$version-Windows.exe")
          if ($version -match '-beta\.\d+$') {
            gh release create $env:RELEASE_TAG @assets --title "Cypher $version (Preview)" --generate-notes --prerelease --latest=false
            $channelFile = 'artifacts/preview.json'
          } else {
            gh release create $env:RELEASE_TAG @assets "artifacts/latest.json" --title "Cypher $version" --generate-notes --latest
            $channelFile = 'artifacts/stable.json'
          }
          gh release view update-channels *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create update-channels --prerelease --latest=false --target $env:GITHUB_SHA --title "Canais de atualização do Cypher" --notes "Manifestos assinados dos canais oficial (stable.json) e Preview (preview.json). Esta não é uma versão do navegador."
          }
          gh release upload update-channels $channelFile --clobber
