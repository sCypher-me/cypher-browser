name: Publicar atualização do Cypher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag de versão já existente para publicar
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar sintaxe e tipos
        run: npm run check
      - name: Executar testes unitários
        run: npm test
      - name: Bloquear publicação com vulnerabilidades altas conhecidas
        run: npm audit --audit-level=high
      - name: Baixar e verificar Tor e i2pd nativos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run prepare:privacy-runtime
      - name: Validar versão e configurar canal público
        env:
          CYPHER_UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.CYPHER_UPDATE_SIGNING_PUBLIC_KEY }}
          CYPHER_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.CYPHER_UPDATE_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:RELEASE_TAG -ne $expectedTag) { throw "A tag precisa ser $expectedTag para corresponder ao package.json." }
          $hasPublicKey = -not [string]::IsNullOrWhiteSpace($env:CYPHER_UPDATE_SIGNING_PUBLIC_KEY)
          $hasPrivateKey = -not [string]::IsNullOrWhiteSpace($env:CYPHER_UPDATE_SIGNING_PRIVATE_KEY)
          if ($hasPublicKey -ne $hasPrivateKey) { throw "Configure juntos CYPHER_UPDATE_SIGNING_PUBLIC_KEY (Actions variable) e CYPHER_UPDATE_SIGNING_PRIVATE_KEY (Actions secret)." }
          if (-not $hasPublicKey) { throw "A publicação exige assinatura Ed25519. Configure CYPHER_UPDATE_SIGNING_PUBLIC_KEY (Actions variable) e CYPHER_UPDATE_SIGNING_PRIVATE_KEY (Actions secret)." }
          @{ repository = $env:GITHUB_REPOSITORY; updateSigningPublicKey = $env:CYPHER_UPDATE_SIGNING_PUBLIC_KEY } | ConvertTo-Json -Compress | Set-Content electron/update-config.json -Encoding utf8
      - name: Compilar a interface do Cypher
        run: npm run build
      - name: Executar smoke tests do navegador
        run: npm run test:smoke
      - name: Gerar aplicativo Windows e versão portátil
        run: npx electron-builder --win dir portable --publish never
      - name: Compilar o instalador autoral Cypher
        run: node scripts/build-installer.cjs
      - name: Gerar manifesto HTTPS e SHA-512
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assetPath = Join-Path (Resolve-Path release) "Cypher-$version-Windows.exe"
          $installerPath = Join-Path (Resolve-Path release) "Cypher-$version-Setup.exe"
          if (-not (Test-Path -LiteralPath $assetPath)) { throw "Executável de lançamento não encontrado: $assetPath" }
          if (-not (Test-Path -LiteralPath $installerPath)) { throw "Instalador de lançamento não encontrado: $installerPath" }
          $assetName = Split-Path $assetPath -Leaf
          $installerAssetName = Split-Path $installerPath -Leaf
          $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA512).Hash
          $installerHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA512).Hash
          $hashBytes = [Convert]::FromHexString($hash)
          $installerHashBytes = [Convert]::FromHexString($installerHash)
          $changeLog = Get-Content CHANGELOG.md -Raw
          $versionHeading = [regex]::Escape($version)
          $changeLogMatch = [regex]::Match($changeLog, "(?ms)^## \[$versionHeading\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)")
          if (-not $changeLogMatch.Success) { $changeLogMatch = [regex]::Match($changeLog, '(?ms)^## \[Unreleased\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)') }
          $releaseNotes = if ($changeLogMatch.Success) { $changeLogMatch.Groups[1].Value.Trim() } else { '' }
          if ([string]::IsNullOrWhiteSpace($releaseNotes)) { $releaseNotes = "Cypher $version — versão mais recente do navegador." }
          if ($releaseNotes.Length -gt 3000) { throw 'O changelog da versão excede 3.000 caracteres.' }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $manifest = [ordered]@{
            schemaVersion = 1
            version = $version
            tag = $env:RELEASE_TAG
            assetName = $assetName
            sha512 = [Convert]::ToBase64String($hashBytes)
            installerAssetName = $installerAssetName
            installerSha512 = [Convert]::ToBase64String($installerHashBytes)
            releaseNotes = $releaseNotes
          }
          $manifest | ConvertTo-Json -Compress | Set-Content artifacts/latest.json -Encoding utf8
      - name: Assinar manifesto de atualização
        env:
          CYPHER_UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.CYPHER_UPDATE_SIGNING_PUBLIC_KEY }}
          CYPHER_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.CYPHER_UPDATE_SIGNING_PRIVATE_KEY }}
        run: node scripts/sign-update-manifest.cjs artifacts/latest.json
      - name: Publicar instalador, versão portátil e manifesto na Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release create $env:RELEASE_TAG "release/Cypher-$version-Setup.exe" "release/Cypher-$version-Windows.exe" "artifacts/latest.json" --title "Cypher $version" --generate-notes --latest
